<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Interativo - Área do Aluno</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos para o Feedback Visual de Respostas */
    .opcao-btn.incorreta {
      background-color: rgba(239, 68, 68, 0.2) !important;
      border-color: #ef4444 !important;
      color: #f87171 !important;
      text-decoration: line-through;
    }

    .opcao-btn.correta-revelada {
      background-color: rgba(34, 197, 94, 0.2) !important;
      border-color: #22c55e !important;
      color: #4ade80 !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- TELA DE LOGIN / IDENTIFICAÇÃO DO ALUNO -->
    <div id="tela-login" class="card">
      <h1>Avaliação Interativa 📝</h1>
      <p>Preencha os campos abaixo para iniciar a sua prova.</p>
      
      <form id="form-login">
        <div class="form-group">
          <label for="nome-aluno">Nome Completo do Aluno:</label>
          <input type="text" id="nome-aluno" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="turma-aluno">Turma / Período:</label>
          <input type="text" id="turma-aluno" placeholder="Ex: 3º Ano A - Ensino Médio" required>
        </div>

        <div class="form-group">
          <label for="materia-select">Selecione a Matéria / Disciplina:</label>
          <select id="materia-select" required>
            <option value="" disabled selected>Escolha uma matéria...</option>
            <option value="TODAS">Todas as Matérias (Misto Geral)</option>
            
            <!-- Matérias Regulares / Escolares -->
            <optgroup label="Matérias Escolas Regulares">
              <option value="Lingua Portuguesa">Língua Portuguesa e Literatura</option>
              <option value="Matematica">Matemática</option>
              <option value="Historia">História Geral e do Brasil</option>
              <option value="Geografia">Geografia</option>
              <option value="Biologia">Biologia</option>
              <option value="Fisica">Física</option>
              <option value="Quimica">Química</option>
              <option value="Ingles">Língua Inglesa</option>
              <option value="Filosofia">Filosofia</option>
              <option value="Sociologia">Sociologia</option>
            </optgroup>

            <!-- Matérias Técnicas / Tecnologia -->
            <optgroup label="Tecnologia e Informática">
              <option value="Desenvolvimento Front-End">Desenvolvimento Front-End</option>
              <option value="Inteligencia Artificial">Inteligência Artificial</option>
              <option value="Redes de computadores e Seguranca da informação na Nuvem">Redes de computadores e Seguranca da informação na Nuvem</option>
              <option value="Processos de desenvolvimento de Software e Metodologias Ageis">Processos de desenvolvimento de Software e Metodologias Ageis</option>
            </optgroup>
          </select>
        </div>

        <button type="submit" class="btn">Iniciar Prova 🚀</button>
      </form>
    </div>

    <!-- TELA DO QUIZ / PERGUNTAS -->
    <div id="tela-quiz" class="card hidden">
      <div class="quiz-header">
        <span id="progresso-txt">Questão 1 de 10</span>
        <span class="badge-pontos" id="pontos-txt">Respondidas: 0/10</span>
      </div>

      <h2 id="pergunta-txt" style="margin-bottom: 20px;">Carregando pergunta...</h2>

      <div class="opcoes-list" id="opcoes-container">
        <!-- Botões renderizados via JavaScript -->
      </div>
    </div>

    <!-- TELA DE RESULTADO FINAL -->
    <div id="tela-resultado" class="card hidden" style="text-align: center;">
      <h1>Avaliação Concluída! 🎉</h1>
      <p>Confira o seu resultado final abaixo:</p>

      <div class="placar-final" id="nota-final-txt">Nota: 0.0 / 10.0</div>
      <p id="detalhes-acertos-txt">Você acertou 0 de 10 questões.</p>

      <div class="status-envio" id="status-envio-txt">Enviando respostas para o professor...</div>
      <br>
      <button id="btn-reiniciar" class="btn btn-secundario">Fazer Outra Prova 🔄</button>
    </div>
  </div>

  <script type="module" src="app.js?v=14"></script>
</body>
</html>
