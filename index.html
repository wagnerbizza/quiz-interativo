<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Aluno - Avaliação</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1, h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
    
    .grupo-form {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label { font-size: 14px; font-weight: bold; color: var(--text-muted); }

    input, select {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #374151;
      color: white;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 15px;
      width: 100%;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn:hover { background: var(--accent-hover); }
    .hidden { display: none !important; }

    .info-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .linha-detalhe { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .linha-detalhe span.icone { min-width: 22px; text-align: center; flex-shrink: 0; }
    .linha-detalhe div.conteudo-texto { flex: 1; word-break: break-word; }

    .opcao-btn {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      transition: all 0.2s ease;
    }

    .opcao-btn:hover { border-color: var(--accent); background: rgba(37, 99, 235, 0.15); }
    .opcao-btn.selecionada { background: var(--accent); border-color: #60a5fa; color: white; }

    .progresso-blocos-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }
    .bloco-progresso-item { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .bloco-progresso-item.pendente { background: #1e293b; border: 1px solid #334155; color: #94a3b8; }
    .bloco-progresso-item.respondida { background: #16a34a; border: 2px solid #22c55e; color: #fff; }
    .bloco-progresso-item.atual { background: #2563eb; border: 2px solid #60a5fa; color: #fff; }

    .item-revisao {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      text-align: left;
    }
    .item-revisao.correta { border-color: var(--success); }
    .item-revisao.incorreta { border-color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <div id="tela-login">
      <h1>ÁREA DO ALUNO - Avaliação</h1>
      <div id="detalhes-prova-ativa" class="info-box">⏳ Verificando se há alguma prova ativa no momento...</div>

      <form id="form-login">
        <div class="grupo-form">
          <label for="nome-aluno">Nome Completo:</label>
          <input type="text" id="nome-aluno" placeholder="Digite seu nome completo..." required>
        </div>
        <div class="grupo-form">
          <label for="turma-aluno">Sua Turma:</label>
          <select id="turma-aluno" required>
            <option value="" disabled selected>Aguardando liberação de turmas...</option>
          </select>
        </div>
        <button type="submit" id="btn-iniciar-prova" class="btn">🚀 Iniciar Avaliação</button>
      </form>
    </div>

    <div id="tela-quiz" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span id="badge-escola-ativa" style="font-size: 13px; color: var(--text-muted); font-weight: bold;">🏫 Escola</span>
        <span id="progresso-txt" style="font-size: 14px; font-weight: bold; color: #38bdf8;">Questão 1 de 10</span>
      </div>

      <div id="resumo-progresso" style="text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 8px;"></div>
      <div id="progresso-blocos-topo" class="progresso-blocos-container"></div>
      <div id="relogio-cronometro" style="display: none;">⏱️ Tempo Gasto: 00:00</div>

      <div style="background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; padding: 18px; border-radius: 10px; margin-bottom: 20px;">
        <h3 id="pergunta-txt" style="font-size: 17px; line-height: 1.4; color: white;">Carregando pergunta...</h3>
      </div>

      <div id="opcoes-container"></div>

      <div id="nav-quiz" style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;">
        <button id="ant" class="btn" style="background: #475569; display: none;">⬅ Anterior</button>
        <button id="prox" class="btn">Próxima ➡</button>
        <button id="fin" class="btn" style="background: var(--success); display: none;">🏁 Finalizar Prova</button>
      </div>
    </div>

    <div id="tela-resultado" class="hidden">
      <h1>🎉 Avaliação Concluída!</h1>
      <div class="info-box" style="text-align: center;">
        <h2 id="nota-final-txt" style="color: var(--success); margin-bottom: 5px;">Nota: 0.0 / 10.0</h2>
        <p id="detalhes-acertos-txt" style="color: var(--text-muted);">Acertos e erros processados com sucesso.</p>
        <p id="status-envio-txt" style="color: #38bdf8; margin-top: 8px; font-weight: bold;"></p>
      </div>

      <h3 style="margin-bottom: 10px; font-size: 15px; text-align: left;">Revisão das Questões:</h3>
      <div id="container-revisao-resultado" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>

      <button type="button" id="btn-reiniciar" class="btn">🔄 Sair / Tela Inicial</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, setDoc, doc, getDoc, onSnapshot, serverTimestamp, deleteDoc, query, where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCp40ALB_7lW7mOfX8NZkS8583YR3Khhbw",
      authDomain: "quiz-interativo-8a98c.firebaseapp.com",
      databaseURL: "https://quiz-interativo-8a98c-default-rtdb.firebaseio.com",
      projectId: "quiz-interativo-8a98c",
      storageBucket: "quiz-interativo-8a98c.firebasestorage.app",
      messagingSenderId: "948601017774",
      appId: "1:948601017774:web:bd0e038611ff6d2148643f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let dadosProvaAtiva = {};
    let listaQuestoes = [], indiceAtual = 0, respostasUsuario = {};
    let alunoAtual = {}, qtdQ = 10;
    let timerInterval = null, segundosPassados = 0;
    let syncOnlineInterval = null;

    const selectTurma = document.getElementById("turma-aluno");
    const inputNomeAluno = document.getElementById("nome-aluno");
    const detalhesProvaAtiva = document.getElementById("detalhes-prova-ativa");
    const btnIniciarProva = document.getElementById("btn-iniciar-prova");

    function limparPrefixoPergunta(pergunta) {
      if (!pergunta) return "";
      let limpa = pergunta.replace(/^\[.*?\]\s*/, "").trim();
      limpa = limpa.replace(/^\(\d+\)\s*/, "").trim();
      limpa = limpa.replace(/^\d+[\)\.\-\s]+\s*/, "").trim();
      return limpa;
    }

    function limparPrefixoOpcao(opcaoStr) {
      if (!opcaoStr) return "";
      let limpo = opcaoStr.toString().replace(/^[a-zA-Z][\)\.\-\s]+\s*/, "").trim();
      let lower = limpo.toLowerCase();
      if (lower.startsWith("alternativa e") || lower.startsWith("opção e")) return "";
      return limpo;
    }

    onSnapshot(doc(db, "configuracoes", "prova_ativa"), (docSnap) => {
      if (docSnap.exists()) {
        dadosProvaAtiva = docSnap.data();
        qtdQ = parseInt(dadosProvaAtiva.quantidadeQuestoes) || 10;
        
        let matsStr = (dadosProvaAtiva.materiasAtivas || []).join(", ");
        let turmas = dadosProvaAtiva.turmasAtivas || [];
        let tempoMinimo = parseInt(dadosProvaAtiva.tempoMinimoMinutos) || 0;
        let tempoLimite = parseInt(dadosProvaAtiva.tempoLimiteMinutos) || 0;

        detalhesProvaAtiva.innerHTML = `
          <div class="linha-detalhe"><span class="icone">🏫</span><div class="conteudo-texto"><strong>Escola:</strong> ${dadosProvaAtiva.escolaAtiva || 'N/D'}</div></div>
          <div class="linha-detalhe"><span class="icone">📚</span><div class="conteudo-texto"><strong>Matéria(s):</strong> ${matsStr || 'Geral'}</div></div>
          <div class="linha-detalhe"><span class="icone">🏛️</span><div class="conteudo-texto"><strong>Período:</strong> ${dadosProvaAtiva.periodoAtivo || 'Geral'}</div></div>
          <div class="linha-detalhe"><span class="icone">🟢</span><div class="conteudo-texto"><strong style="color: #4ade80;">Horário liberado! Você já pode iniciar a sua avaliação.</strong></div></div>
          <div class="linha-detalhe"><span class="icone">⏱️</span><div class="conteudo-texto"><strong>Tempo Mínimo:</strong> ${tempoMinimo > 0 ? tempoMinimo + ' minutos' : 'Nenhum'}</div></div>
          <div class="linha-detalhe"><span class="icone">⏳</span><div class="conteudo-texto"><strong>Tempo Limite:</strong> ${tempoLimite > 0 ? tempoLimite + ' minutos' : 'Sem limite'}</div></div>
          <div class="linha-detalhe"><span class="icone">🔒</span><div class="conteudo-texto"><strong>Exige Token:</strong> ${dadosProvaAtiva.token ? 'Sim' : 'Não'}</div></div>
        `;

        if (selectTurma && turmas.length > 0) {
          selectTurma.innerHTML = `<option value="" disabled selected>Selecione sua turma...</option>`;
          turmas.forEach(t => {
            selectTurma.innerHTML += `<option value="${t}">${t}</option>`;
          });
        }
      }
    });

    document.getElementById("form-login")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nomeVal = inputNomeAluno.value.trim().toUpperCase();
      const turmaVal = selectTurma.value;

      if (!nomeVal || !turmaVal) { alert("⚠️ Preencha seu nome e turma."); return; }

      const idAlunoGerado = `${nomeVal.replace(/[^A-Z0-9]/g, "_")}_${turmaVal.replace(/[^A-Z0-9]/g, "_")}`;

      // VERIFICAÇÃO INTELIGENTE DE PERMISSÃO: Respeita a reautorização do professor
      try {
        const docPermissao = await getDoc(doc(db, "permissoes_alunos", idAlunoGerado));
        
        // Se explicitamente configurado como false (e o professor não reautorizou para true), bloqueia
        if (docPermissao.exists() && docPermissao.data().podeFazer === false) {
          alert("❌ Registro encontrado: Esta avaliação já foi concluída e o acesso está bloqueado. Solicite liberação ao professor.");
          return;
        }
      } catch (err) {
        console.error("Erro ao verificar permissões:", err);
      }

      if (dadosProvaAtiva.token && dadosProvaAtiva.token.trim() !== "") {
        let tokenInput = prompt("🔒 Digite o token/senha fornecido pelo professor para acessar a prova:");
        if (tokenInput !== dadosProvaAtiva.token) {
          alert("❌ Token incorreto! Acesso negado.");
          return;
        }
      }

      alunoAtual = {
        nome: nomeVal,
        escola: dadosProvaAtiva.escolaAtiva,
        periodo: dadosProvaAtiva.periodoAtivo || "Geral",
        materia: (dadosProvaAtiva.materiasAtivas || ["Geral"]).join(" / "),
        turma: turmaVal,
        id: idAlunoGerado
      };

      btnIniciarProva.disabled = true;
      btnIniciarProva.textContent = "Carregando...";
      await iniciarCarregamentoProva();
    });

    async function iniciarCarregamentoProva() {
      segundosPassados = 0;
      let banco = [];
      try {
        let snap = await getDocs(collection(db, "questoes"));
        if (snap.empty) {
          snap = await getDocs(collection(db, "banco_questoes"));
        }

        snap.forEach(s => {
          let d = s.data();
          let perguntaLimpa = limparPrefixoPergunta(d.pergunta || d.questao || d.titulo || "Sem Título");
          let opcoesBrutas = d.opcoes || d.alternativas || d.respostas || [];
          
          let opcoesLimpas = opcoesBrutas
            .map(op => limparPrefixoOpcao(op))
            .filter(op => {
              if (!op || op === "") return false;
              let lower = op.toLowerCase();
              if (lower.startsWith("alternativa e") || lower.startsWith("opção e")) return false;
              return true;
            });

          let letraOriginal = (d.correta || d.resposta || d.correto || "A").toString().trim().toUpperCase();
          let indiceOriginal = {"A": 0, "B": 1, "C": 2, "D": 3, "E": 4}[letraOriginal] || 0;
          if (indiceOriginal >= opcoesLimpas.length) indiceOriginal = 0;

          let alternativasMapeadas = opcoesLimpas.map((texto, idx) => ({
            texto: texto,
            ehCorreta: (idx === indiceOriginal)
          }));

          let distratoresSeguros = [
            "Processamento autônomo baseado em regras estáticas locais",
            "Conversão estruturada de metadados em arquivos compactados",
            "Execução direta de rotinas em camada de hardware isolada",
            "Indexação sequencial de logs e repositórios desatualizados"
          ];

          let contC = 0;
          while (alternativasMapeadas.length < 5) {
            let txtComp = distratoresSeguros[contC % distratoresSeguros.length];
            contC++;
            alternativasMapeadas.push({ texto: txtComp, ehCorreta: false });
          }

          if (alternativasMapeadas.length > 5) alternativasMapeadas = alternativasMapeadas.slice(0, 5);

          for (let i = alternativasMapeadas.length - 1; i > 0; i--) {
            const aleatorio = crypto.getRandomValues(new Uint32Array(1))[0];
            const j = Math.floor((aleatorio / 4294967295) * (i + 1));
            [alternativasMapeadas[i], alternativasMapeadas[j]] = [alternativasMapeadas[j], alternativasMapeadas[i]];
          }

          let novoIndiceCorreto = alternativasMapeadas.findIndex(alt => alt.ehCorreta);
          if (novoIndiceCorreto === -1) novoIndiceCorreto = 0;
          let letraCorretaFinal = ["A", "B", "C", "D", "E"][novoIndiceCorreto];

          banco.push({
            pergunta: perguntaLimpa,
            opcoes: alternativasMapeadas.map(alt => alt.texto),
            correta: letraCorretaFinal,
            categoria: d.categoria || d.materia || "Geral"
          });
        });
      } catch(e) { console.error("Erro ao buscar no Firebase:", e); }

      let materiasAtivas = dadosProvaAtiva.materiasAtivas || [];
      let filtradas = [];
      
      if (materiasAtivas.length > 0) {
        materiasAtivas.forEach(mat => {
          let normMat = mat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
          let qMat = banco.filter(q => {
            let normCat = (q.categoria || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            return normCat.includes(normMat) || normMat.includes(normCat);
          });
          filtradas.push(...qMat);
        });
      }

      if (filtradas.length === 0) filtradas = [...banco];

      let qtdDesejada = parseInt(qtdQ) || 10;
      let materiaNome = materiasAtivas.length > 0 ? materiasAtivas[0] : "Conteúdo Geral";

      let poolTemasBase = [
        "Fundamentos e diretrizes estruturais aplicadas ao contexto operacional",
        "Parâmetro secundário de validação e verificação de integridade",
        "Mecanismo auxiliar de processamento síncrono e integrado",
        "Diretiva de controle e auditoria de fluxo sistêmico",
        "Abordagem complementar voltada ao suporte técnico avançado",
        "Otimização contínua de parâmetros em ambientes de alta carga",
        "Gerenciamento autônomo de dependências em camadas isoladas",
        "Tratamento estruturado de exceções e logs de auditoria",
        "Mapeamento sequencial de metadados em repositórios remotos",
        "Sincronização de estados entre arquiteturas distribuídas"
      ];

      let contadorGeracao = 1;
      while (filtradas.length < qtdDesejada) {
        let temaAtual = poolTemasBase[(contadorGeracao - 1) % poolTemasBase.length];
        filtradas.push({
          pergunta: `Análise técnica e conceitual sobre os aspectos práticos da disciplina de ${materiaNome} - Módulo ${contadorGeracao}`,
          opcoes: [
            temaAtual,
            "Processamento autônomo baseado em regras estáticas locais",
            "Conversão estruturada de metadados em arquivos compactados",
            "Execução direta de rotinas em camada de hardware isolada",
            "Indexação sequencial de logs e repositórios desatualizados"
          ],
          correta: "A",
          categoria: materiaNome
        });
        contadorGeracao++;
      }

      let mapaUnicas = new Map();
      filtradas.forEach(q => {
        let chave = (q.pergunta || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        if (chave && !mapaUnicas.has(chave)) mapaUnicas.set(chave, q);
      });
      let unicasArray = Array.from(mapaUnicas.values());

      for (let i = unicasArray.length - 1; i > 0; i--) {
        const aleatorio = crypto.getRandomValues(new Uint32Array(1))[0];
        const j = Math.floor((aleatorio / 4294967295) * (i + 1));
        [unicasArray[i], unicasArray[j]] = [unicasArray[j], unicasArray[i]];
      }

      listaQuestoes = unicasArray.slice(0, qtdDesejada);

      document.getElementById("badge-escola-ativa").textContent = `🏫 ${alunoAtual.escola} | Turma: ${alunoAtual.turma}`;
      document.getElementById("tela-login").classList.add("hidden");
      document.getElementById("tela-quiz").classList.remove("hidden");

      iniciarCronogerenciamento();
      iniciarSincronizacaoTempoReal();
      exibirQuestao();
    }

    function iniciarCronogerenciamento() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => { segundosPassados++; }, 1000);
    }

    function iniciarSincronizacaoTempoReal() {
      if (syncOnlineInterval) clearInterval(syncOnlineInterval);
      syncOnlineInterval = setInterval(async () => {
        if (!alunoAtual.id) return;
        try {
          let acertosParciais = 0;
          listaQuestoes.forEach((q, idx) => {
            if (respostasUsuario[idx] === q.correta) acertosParciais++;
          });

          await setDoc(doc(db, "alunos_online", alunoAtual.id), {
            nome: alunoAtual.nome,
            turma: alunoAtual.turma,
            escola: alunoAtual.escola,
            materia: alunoAtual.materia,
            periodo: alunoAtual.periodo,
            questaoAtual: indiceAtual + 1,
            totalQuestoes: listaQuestoes.length,
            segundosPassados: segundosPassados,
            pontuacao: acertosParciais,
            atualizadoEm: serverTimestamp()
          }, { merge: true });
        } catch(e) {}
      }, 5000);
    }

    function exibirQuestao() {
      const q = listaQuestoes[indiceAtual];
      document.getElementById("pergunta-txt").textContent = `${indiceAtual + 1}. ${q.pergunta}`;
      document.getElementById("progresso-txt").textContent = `Questão ${indiceAtual + 1} de ${listaQuestoes.length}`;

      let htmlBlocos = "";
      listaQuestoes.forEach((_, index) => {
        let classe = index === indiceAtual ? "atual" : (respostasUsuario[index] !== undefined ? "respondida" : "pendente");
        htmlBlocos += `<div class="bloco-progresso-item ${classe}" onclick="window.irQuestao(${index})">${index + 1}</div>`;
      });
      document.getElementById("progresso-blocos-topo").innerHTML = htmlBlocos;

      const container = document.getElementById("opcoes-container");
      container.innerHTML = "";

      ["A", "B", "C", "D", "E"].forEach((letra, idx) => {
        const texto = q.opcoes[idx] || `Alternativa ${letra}`;
        const btn = document.createElement("button");
        btn.className = "opcao-btn" + (respostasUsuario[indiceAtual] === letra ? " selecionada" : "");
        btn.textContent = `${letra}) ${texto}`;
        btn.onclick = () => { respostasUsuario[indiceAtual] = letra; exibirQuestao(); };
        container.appendChild(btn);
      });

      document.getElementById("ant").style.display = indiceAtual === 0 ? "none" : "block";
      document.getElementById("prox").style.display = indiceAtual === listaQuestoes.length - 1 ? "none" : "block";
      document.getElementById("fin").style.display = indiceAtual === listaQuestoes.length - 1 ? "block" : "none";
    }

    window.irQuestao = function(index) { indiceAtual = index; exibirQuestao(); };

    document.getElementById("ant")?.addEventListener("click", () => { if (indiceAtual > 0) { indiceAtual--; exibirQuestao(); } });
    document.getElementById("prox")?.addEventListener("click", () => { if (indiceAtual < listaQuestoes.length - 1) { indiceAtual++; exibirQuestao(); } });
    document.getElementById("fin")?.addEventListener("click", finalizarProva);

    async function finalizarProva() {
      if (timerInterval) clearInterval(timerInterval);
      if (syncOnlineInterval) clearInterval(syncOnlineInterval);
      document.getElementById("tela-quiz").classList.add("hidden");
      document.getElementById("tela-resultado").classList.remove("hidden");

      let acertos = 0;
      let htmlRev = "";
      listaQuestoes.forEach((q, idx) => {
        const resp = respostasUsuario[idx] || "-";
        const correta = (resp === q.correta);
        if (correta) acertos++;
        htmlRev += `<div class="item-revisao ${correta ? 'correta' : 'incorreta'}"><p><strong>${idx+1}. ${q.pergunta}</strong></p><p>Sua resposta: ${resp} ${correta ? '✅' : '❌'}</p></div>`;
      });

      let erros = listaQuestoes.length - acertos;
      let nota = listaQuestoes.length > 0 ? ((acertos / listaQuestoes.length) * 10).toFixed(1) : "0.0";
      let min = Math.floor(segundosPassados / 60);
      let seg = segundosPassados % 60;
      let tempoGastoFormatado = `${min}m ${seg}s`;

      document.getElementById("nota-final-txt").textContent = `Nota Proporcional: ${nota} / 10.0`;
      document.getElementById("detalhes-acertos-txt").textContent = `Acertos: ${acertos} | Erros: ${erros} | Tempo: ${tempoGastoFormatado}`;
      document.getElementById("container-revisao-resultado").innerHTML = htmlRev;

      try {
        const agora = Date.now();
        await setDoc(doc(db, "avaliacoes", (9999999999999 - agora).toString()), {
          idAluno: alunoAtual.id,
          nome: alunoAtual.nome,
          turma: alunoAtual.turma,
          escola: alunoAtual.escola,
          periodo: alunoAtual.periodo,
          materia: alunoAtual.materia,
          pontuacao: acertos,
          totalQuestoes: listaQuestoes.length,
          tempoGastoSegundos: segundosPassados,
          tempoGastoFormatado: tempoGastoFormatado,
          dataEnvio: serverTimestamp(),
          timestamp: agora
        });

        await setDoc(doc(db, "permissoes_alunos", alunoAtual.id), { podeFazer: false }, { merge: true });
        await deleteDoc(doc(db, "alunos_online", alunoAtual.id));

        document.getElementById("status-envio-txt").textContent = "Avaliação enviada e salva com sucesso! ✅";
      } catch (err) {
        document.getElementById("status-envio-txt").textContent = "⚠️ Erro ao salvar resultado online.";
      }
    }

    document.getElementById("btn-reiniciar")?.addEventListener("click", () => {
      respostasUsuario = {};
      indiceAtual = 0;
      listaQuestoes = [];
      alunoAtual = {};
      document.getElementById("tela-resultado").classList.add("hidden");
      document.getElementById("tela-login").classList.remove("hidden");
      if (btnIniciarProva) {
        btnIniciarProva.disabled = false;
        btnIniciarProva.textContent = "🚀 Iniciar Avaliação";
      }
      if (inputNomeAluno) inputNomeAluno.value = "";
    });
  </script>
</body>
</html>
