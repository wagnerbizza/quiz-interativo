<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Interativa - Aluno</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease-in-out; }
    body.fade-in { opacity: 1; }
    .card-quiz { background-color: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .hidden { display: none !important; }
    h2, h3 { color: #93c5fd; margin-bottom: 15px; }
    label { display: block; margin-top: 12px; color: #cbd5e1; font-size: 14px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; margin-top: 6px; background-color: #0f172a; border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 14px; }
    button.btn-acao { background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; font-size: 16px; }
    button.btn-acao:hover { opacity: 0.9; }
    .badge-escola { background: #0f172a; border: 1px solid #22c55e; padding: 10px; border-radius: 6px; font-size: 13px; color: #4ade80; margin-bottom: 15px; text-align: center; font-weight: bold; }
    .info-questao { font-size: 13px; color: #94a3b8; margin-bottom: 10px; }
    .item-revisao { background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 5px solid #2563eb; font-size: 14px; }
    .item-revisao.correta { border-left-color: #22c55e; }
    .item-revisao.incorreta { border-left-color: #ef4444; }
  </style>
</head>
<body>

  <div class="card-quiz">
    <!-- TELA DE LOGIN / IDENTIFICAÇÃO DO ALUNO -->
    <div id="tela-login">
      <h2>🎓 Identificação do Aluno</h2>
      <div id="detalhes-prova-ativa" style="background: #0f172a; padding: 12px; border-radius: 6px; font-size: 13px; color: #94a3b8; margin-bottom: 15px; border: 1px dashed var(--border);">
        Carregando informações da prova ativa...
      </div>
      <form id="form-login">
        <label>Nome Completo:</label>
        <input type="text" id="nome-aluno" placeholder="Digite seu nome..." required>
        <label>Turma:</label>
        <select id="turma-aluno" required>
          <option value="" disabled selected>Aguardando turmas da prova...</option>
        </select>
        <button type="submit" class="btn-acao">🚀 Iniciar Avaliação</button>
      </form>
    </div>

    <!-- TELA DE RESOLUÇÃO DA PROVA -->
    <div id="tela-quiz" class="hidden">
      <!-- Elemento fixo para exibir o cronômetro do aluno -->
      <div id="relogio-cronometro" style="display: none;"></div>

      <div id="badge-escola-ativa" class="badge-escola">Carregando dados...</div>
      <div class="info-questao" id="progresso-txt">Questão 1 de 10</div>
      <h3 id="pergunta-txt">Carregando pergunta...</h3>
      <div id="opcoes-container"></div>
    </div>

    <!-- TELA DE RESULTADO -->
    <div id="tela-resultado" class="hidden">
      <h2>📊 Resultado da Avaliação</h2>
      <h3 id="nota-final-txt" style="color: #4ade80; font-size: 22px; margin-top: 10px;">Nota: 0.0 / 10.0</h3>
      <p id="detalhes-acertos-txt" style="color: #cbd5e1; margin-bottom: 15px; font-size: 14px;"></p>
      
      <h3 style="font-size: 16px; margin-top: 20px; color: #60a5fa;">📋 Revisão das Questões:</h3>
      <div id="container-revisao-resultado" style="max-height: 250px; overflow-y: auto; margin-top: 10px; padding-right: 5px;"></div>
      
      <p id="status-envio-txt" style="font-size: 13px; color: #facc15; margin-top: 15px; text-align: center; font-weight: bold;"></p>
      <button id="btn-reiniciar" class="btn-acao" style="background-color: #4b5563; margin-top: 15px;">🔄 Concluir e Sair</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
