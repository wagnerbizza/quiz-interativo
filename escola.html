<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração Específica da Escola</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --primary: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --text: #f8fafc;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 20px; min-height: 100vh; opacity: 0; transition: opacity 0.3s ease-in-out; }
    body.fade-in { opacity: 1; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 25px; }
    header h1 { color: #60a5fa; font-size: 26px; }

    .banner-topo { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #3b82f6; padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(37,99,235,0.15); }
    .banner-topo h2 { color: #60a5fa; font-size: 20px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .resumo-topo-detalhes { background: #0f172a; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; color: #cbd5e1; margin-top: 12px; line-height: 1.6; }

    .card-box { background-color: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
    .box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .box-header h2 { color: #93c5fd; font-size: 18px; display: flex; align-items: center; gap: 8px; }

    .aviso-geral { background: #0f172a; border-left: 4px solid var(--warning); padding: 10px 14px; border-radius: 4px; font-size: 13px; color: #cbd5e1; margin-bottom: 15px; }

    .grid-checkboxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; max-height: 180px; overflow-y: auto; padding-right: 5px; }
    .checkbox-item { background: #0f172a; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .checkbox-item span { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; }
    
    .acoes-item-global { display: flex; gap: 4px; }
    .btn-editar-item, .btn-excluir-item { background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px 5px; border-radius: 4px; }
    .btn-editar-item:hover { background: #334155; }
    .btn-excluir-item:hover { background: #ef4444; }

    .input-grupo-add { display: flex; gap: 10px; margin-top: 12px; }
    .input-grupo-add input { flex: 1; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 13px; }
    .input-grupo-add button { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .resultado-parcial { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px dashed var(--border); margin-top: 10px; min-height: 40px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: #94a3b8; }
    .tag-selecao { background: #1e293b; border: 1px solid #3b82f6; color: #60a5fa; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

    .tabela-conferencia { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .tabela-conferencia th, .tabela-conferencia td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .tabela-conferencia th { color: #60a5fa; background: #0f172a; }
    .btn-acao-tabela { background: none; border: none; cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px; }
    .btn-editar { color: #eab308; } .btn-editar:hover { background: #334155; }
    .btn-excluir { color: #ef4444; } .btn-excluir:hover { background: #334155; }

    .btn-mini { background: #334155; color: white; border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
    .btn-mini:hover { background: #475569; }

    .barra-botoes-fixa { display: flex; gap: 15px; margin-top: 30px; margin-bottom: 40px; }
    .btn-acao { background-color: var(--primary); color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; text-decoration: none; font-size: 15px; }
    .btn-acao:hover { opacity: 0.9; }
    .btn-sucesso-animado { background-color: var(--success) !important; }

    #toast-notification { position: fixed; top: 20px; right: 20px; background-color: #1e293b; color: #fff; padding: 16px 24px; border-radius: 8px; border-left: 6px solid #2563eb; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 9999; display: none; font-weight: bold; }
  </style>
</head>
<body>

  <div id="toast-notification">Notificação</div>

  <div class="container">
    <header>
      <h1>⚙️ Configuração Individual da Unidade Escolar</h1>
    </header>

    <div class="banner-topo">
      <h2 id="banner-escola-ativa-isolada">🏫 Configurando Unidade: Carregando...</h2>
      <div id="texto-resumo-escolhas" class="resumo-topo-detalhes">
        Carregando resumo das escolhas...
      </div>
    </div>


    <div id="container-boxes-escola"></div>

    <div style="background: #0f172a; padding: 18px; border-radius: 8px; border: 1px dashed var(--border); margin-top: 25px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <input type="text" id="input-nova-box-escola" placeholder="Nome da Nova Box Específica (Ex: Laboratórios)..." style="flex: 1; margin: 0; padding: 10px; background: #1e293b; border: 1px solid var(--border); color: white; border-radius: 6px;">
      <button type="button" class="btn-acao" style="margin: 0; background-color: #2563eb; padding: 10px 16px;" onclick="criarNovaBoxEscola()">➕ Adicionar Box Específica</button>
    </div>

    <div class="barra-botoes-fixa">
      <button type="button" id="btn-salvar-isolada" class="btn-acao" style="background-color: #22c55e;">💾 Salvar Configurações desta Escola</button>
      <a href="painel.html" class="btn-acao" style="background-color: #4b5563; text-align: center;">🔙 Voltar ao Painel</a>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
